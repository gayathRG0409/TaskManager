[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy API to Render in production (same-origin /api for the browser)
[[redirects]]
  from = "/api/*"
  to = "https://taskmanager-d6v7.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
